name: codeql

on:
  push:
    branches: [main]
    paths: ["dailybugbounties/**", "docs/index.html", ".github/workflows/**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 6 * * 1"   # weekly

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: github/codeql-action/init@v4
        with: { languages: "${{ matrix.language }}" }
      - uses: github/codeql-action/analyze@v4
