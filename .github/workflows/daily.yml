name: daily feed

on:
  schedule:
    - cron: "17 5,17 * * *"   # every 12 hours, 05:17 and 17:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["dailybugbounties/**", "blocklist.txt", ".github/workflows/daily.yml"]

# Least privilege: read only by default; only the job that commits the feed can write.
permissions:
  contents: read

concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: python -m unittest discover -s tests -v

  feed:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: Build feed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m dailybugbounties --root .
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data assets docs/bounties.json docs/feed.xml docs/history.csv
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          COUNT=$(python -c "import json;d=json.load(open('data/bounties.json'));print(f\"{d['count']} bounties, \${d['total_usd']:,.0f}\")")
          git commit -m "feed: $COUNT ($(date -u +%F))"
          git push
